# Sample workflow for building and deploying a Jekyll site
name: Build and Deploy Jekyll site
on:
  # run every year (to clear the copyright)
  schedule:
    - cron: "5 0 1 1 *"
  # Runs on pushes targeting the default branch
  push:
    branches: "main"
    # But ignore if the commit only updates these
    # paths
    paths-ignore:
      - ".github/**"
      - "!.github/filter_rules.yml"
      - "README.md"
      - "LICENSE"
      - ".git*"
      - ".node-version"
      - "package-lock.json"
      - "package.json"
      - "wrangler.toml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      clear_cache:
        description: "Clear Cache"
        required: true
        type: boolean

permissions:
  contents: read
  actions: write
  deployments: write

jobs:
  build_jekyll:
    uses: socksthewolf/workflows/.github/workflows/build_jekyll.yml@main
    secrets: inherit
    with:
      force_clear: ${{ inputs.clear_cache == 'true' || github.event_name == 'schedule' }}
      should_clean: true
      needs_after_run: false
      ref: ${{ github.ref }}
