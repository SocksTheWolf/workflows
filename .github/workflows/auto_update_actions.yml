# Updates all github actions builds with tags "github-actions" and "nodejs" that you own
# Creates the latest dependencies and then creates new releases for them
#
# This will not work on any repositories that are technically forks, even if forked with the intent to not push back to mainline.
# The only fix to this is to disconnect from the fork network.
#
# It is recommended to have an environment named wrangler-update,
# but you can also just set it in the repository secrets
#
# The following secrets should be created:
#   * CREATE_PR_TOKEN - PAT that has coverage for creating pull requests, writing repos
#   * READ_REPO_TOKEN - PAT that has coverage for reading your repos. You cannot use GITHUB_TOKEN, as it will not show private repos.
#   * GPG_PASSPHRASE - For auto commits, that are signed.
#   * GPG_PRIVATE_KEY - For auto commits, on signing.

name: Auto Update Github Actions
on:
  workflow_dispatch: {}
  # Allow Wrangler Updater To Call This
  workflow_call: {}

# Probably could consolidate the bash scripts, but w/e
defaults:
  run:
    shell: bash

concurrency:
  group: actions
  cancel-in-progress: false
  queue: single

jobs:
  get-repos:
    name: Prepare Runtime Update
    runs-on: ubuntu-latest
    environment: wrangler-update
    permissions:
      contents: read
    outputs:
      repos: ${{ steps.get-repos.outputs.repos }}
    steps:
      - name: Query Repos
        id: get-repos
        uses: raven-actions/get-repos@c6353ce68aeca50cdbef29c5e76a627cd5503c4a
        with:
          owner: ${{ github.repository_owner }}
          # You should pass a token that is NOT the WRITE_PR secret
          github-token: ${{ secrets.READ_REPO_TOKEN }}
          topics: "github-actions,nodejs"
          operator: "AND"

  update-actions-repos:
    name: Update Action Builds For (${{ matrix.repo.name }})
    runs-on: ubuntu-latest
    needs: get-repos
    # make sure repos exist
    if: ${{ needs.get-repos.outputs.repos != '[]' }}
    environment: wrangler-update

    # Actual Config Settings
    env:
      # The commit message. If a Pull Request is being opened, this is the title of the pull request.
      COMMIT_MESSAGE: "Chore: Update Builds"

      # If commits should be signed. If true, the commits will show up as whatever's in your GPG key
      # Otherwise, it will be github-actions[bot]
      SIGN_COMMITS: "true"

      # These are unused if SIGN_COMMITS == 'true'
      DEFAULT_USERNAME: ${{ github.actor }}
      DEFAULT_EMAIL: ""

    # If signing is off or the only repos being used are public
    # then these permissions are used
    permissions:
      contents: write
    strategy:
      matrix:
        repo: ${{ fromJson(needs.get-repos.outputs.repos) }}
      fail-fast: false
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          token: ${{ secrets.CREATE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          repository: ${{ matrix.repo.full_name }}

      - name: Node Install
        id: node
        uses: actions/setup-node@v7
        with:
          cache: "npm"
          cache-dependency-path: "package-lock.json"
          node-version-file: ".node-version"
          package-manager-cache: true

      - name: Bump Versions
        run: npm version patch

        # In the future, use this to bump the version numbers
      - name: Read packages.json
        id: package_read
        uses: socksthewolf/github-action-json@f5b8639eabc0eb63279e4efe8206e8fd5d6bd811

      - name: Update Builds
        run: |
          echo "updating builds"
          npm install --ignore-scripts --allow-git=none && npm run bundle

        # Set up the GPG Key for Signing Commits
      - name: ${{ case(env.SIGN_COMMITS == 'true', 'Doing:', 'Skipping:') }} Setup GPG Key
        id: import-gpg
        if: ${{ env.SIGN_COMMITS == 'true' }}
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Commit Files
        id: commit
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d
        with:
          tag_name: ${{ format('v{0}', steps.package_read.outputs.version )}}
          commit_message: ${{ env.COMMIT_MESSAGE }}
          commit_author: |-
            ${{ case(env.SIGN_COMMITS == 'true',
              format('{0} <{1}>', steps.import-gpg.outputs.name, steps.import-gpg.outputs.email),
              format('{0} <{1}>', env.DEFAULT_USERNAME, env.DEFAULT_EMAIL)
            ) }}
          commit_user_name: ${{ case(env.SIGN_COMMITS == 'true', steps.import-gpg.outputs.name, env.DEFAULT_USERNAME) }}
          commit_user_email: ${{ case(env.SIGN_COMMITS == 'true', steps.import-gpg.outputs.email, env.DEFAULT_EMAIL) }}
          # All Commits are Signed
          commit_options: ${{ case(env.SIGN_COMMITS == 'true', '-S', '') }}

      - name: |-
          ${{ format('Commit Result: {0}',
            case(steps.commit.outputs.changes_detected == 'true', 'Committed', 'No Changes')) }}
        if: ${{ success() && steps.commit.outcome == 'success' }}
        run: echo "Commit Result!"

      - name: Make Release
        if: ${{ steps.commit.outcome == 'success' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          repository: ${{ matrix.repo.full_name }}
          token: ${{ secrets.CREATE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          overwrite_files: false
          tag_name: ${{ format('v{0}', steps.package_read.outputs.version )}}
          body: "Updated Actions Build"
          generate_release_notes: true

