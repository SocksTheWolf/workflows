version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 7
    ignore:
      # ignore ruby as it updates all the time
      - dependency-name: 'ruby/setup-ruby'
      # ignore this because it doesn't have pinned releases and I don't want to check the contents every time
      # it can be removed once the issue is resolved.
      - dependency-name: 'raven-actions/get-repos'

  # node updates (it's a fake install to trick dependabot to keep track of wrangler for us)
  - package-ecosystem: "npm"
    directory: "/wrangler-updates"
    open-pull-requests-limit: 2
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2
